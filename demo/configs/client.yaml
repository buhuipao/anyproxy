---

log:
  level: "debug"
  format: "text"
  output: "stdout"
  file: "logs/anyproxy.log"
  max_size: 100           
  max_backups: 5          
  max_age: 30             
  compress: true          

client:
  id: "client-demo"
  gateway:
    addr: "47.107.181.88:8443"  # demo gateway address
    transport_type: "quic"
    tls_cert: "certs/server.crt"
    auth_username: "gateway_user"
    auth_password: "gateway_password"
  # You must set group_id and group_password
  group_id: "demo-xxx"
  group_password: "demo-password123!"
  replicas: 16
  forbidden_hosts:
  allowed_hosts:
  open_ports:
  web:
    enabled: true
    listen_addr: ":8091"
    static_dir: "web/client/static"
    auth_enabled: true
    auth_username: "admin"
    auth_password: "admin123"
    session_key: "change-this-secret-key"
