# AnyProxy Client Configuration for TUIC Latency Testing
# This client connects to the remote gateway and forwards traffic to local mock services
#
# Gateway Transport: 127.0.0.1:8443 (QUIC transport layer)
# TUIC Proxy:        127.0.0.1:9443 (for direct TUIC testing)
#
---

log:
  level: "debug"
  format: "text"
  output: "stdout"

client:
  id: "latency-test-client"
  group_id: "demo-group"
  group_password: "demo-123"
  replicas: 6  # Multiple replicas for high throughput testing (2K 120Hz needs ~80Mbps)
  
  gateway:
    #addr: "47.107.181.88:8443"  # Gateway transport layer (Aliyun NOT TUIC proxy 9443)
    addr: "127.0.0.1:8443"  # Gateway transport layer (NOT TUIC proxy 9443)
    transport_type: "quic"
    tls_cert: "certs/server.crt"  # Gateway's TLS certificate for verification
    auth_username: "gateway_user"
    auth_password: "gateway_password"
  
  # Allow access to local mock services
  allowed_hosts:

  # Block everything except our test services (for security)
  forbidden_hosts:
  
  # Client web interface (optional, for monitoring)
  web:
    enabled: true
    listen_addr: ":8091"
    static_dir: "web/client/static"
    auth_enabled: false
