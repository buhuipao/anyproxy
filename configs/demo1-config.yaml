---

log:
  level: "debug"
  format: "text"
  output: "stdout"
  file: "logs/anyproxy.log"
  max_size: 100           
  max_backups: 5          
  max_age: 30             
  compress: true          

gateway:
  listen_addr: ":8443"
  transport_type: "quic"
  tls_cert: "certs/demo-server.crt"
  tls_key: "certs/demo-server.key"
  auth_username: "gateway_user"
  auth_password: "gateway_password"
  credential:
    type: "memory"        # Options: "memory" (default) or "file"
    # file_path: "credentials/groups.json"  # Only needed when type is "file"
  proxy:
    socks5:
      listen_addr: ":1080"
    http:
      listen_addr: ":8080"
      # Optional: Enable HTTPS proxy by providing TLS certificates
      # tls_cert: "certs/http-proxy.crt"
      # tls_key: "certs/http-proxy.key"
    tuic:
      listen_addr: ":9443"
  web:
    enabled: true
    listen_addr: ":8090"
    static_dir: "web/gateway/static"
    auth_enabled: true
    auth_username: "admin"
    auth_password: "admin123"
    session_key: "change-this-secret-key"

client:
  id: "demo-123"
  group_id: "demo-123"
  group_password: "demo-123"
  replicas: 3
  gateway:
    addr: "47.107.181.88:8443"
    transport_type: "quic"
    tls_cert: "certs/demo-server.crt"
    auth_username: "gateway_user"
    auth_password: "gateway_password"
  allow_ipv6: false  # Before turning it on, also forbid IPv6 ranges (see client-example.yaml)
  forbidden_hosts:
  allowed_hosts:
  open_ports:
  web:
    enabled: true
    listen_addr: ":8091"
    static_dir: "web/client/static"
    auth_enabled: true
    auth_username: "admin"
    auth_password: "admin123"
    session_key: "change-this-secret-key"
